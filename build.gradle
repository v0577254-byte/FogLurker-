plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.36'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'FogLurker' // jars are FogLurker-<version>.jar (see README: Versioning)
}

// Minecraft 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets {
    main.resources { srcDir 'src/generated/resources' }
    // In-game tests live in their own source set so they never ship in the mod jar.
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Dev only: ./gradlew runClient -PfoglurkerShowcase  (needs a world called "FogShowcase")
            // lines up every disguise in front of the camera and saves screenshots.
            if (project.hasProperty('foglurkerShowcase')) {
                property 'foglurker.showcase', 'true'
                if (project.hasProperty('foglurkerScene')) {
                    property 'foglurker.scene', project.property('foglurkerScene').toString()
                }
                args '--quickPlaySingleplayer', 'FogShowcase', '--width', '1280', '--height', '720'
                mods {
                    "${mod_id}" {
                        source sourceSets.gametest
                    }
                }
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Headless in-game test run: ./gradlew runGameTestServer
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.gametest
                }
            }
        }
    }
}

repositories {
    maven {
        // Simple Voice Chat API (https://modrinth.com/plugin/simple-voice-chat)
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Builds the mixins' refmap (dev names to the game's own) at compile time.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Only needed at compile time: the voice features switch on automatically
    // when Simple Voice Chat is installed, and stay off when it is not.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
}

mixin {
    add sourceSets.main, 'foglurker.refmap.json'
    config 'foglurker.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
