modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="foglurker_logo.png"
authors="${mod_authors}"
description='''${mod_description}

Something in the fog has been watching you play. It knows how you move, how you type,
what your friends sound like and what your dog's name is.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: Simple Voice Chat (https://modrinth.com/plugin/simple-voice-chat).
# When it is installed the creature can play opted-in players' voice snippets.
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="[1.20.1-2.4.0,)"
    ordering="NONE"
    side="BOTH"
